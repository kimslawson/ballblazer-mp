# ld65 config for the injected network patch (netpatch + netgame + ncio).
# Produces a flat blob to load into a free region of the running game. The
# start address here is provisional (see docs/05 "Free RAM"): the final home is
# the reclaimed droid-AI region plus page-6 buffers, or extra disk sectors. This
# config is mainly for building/sizing and for the emulator hook test.
#
# Only ng_ptr (2 bytes) truly needs zero page (indirect-indexed checksum walk);
# the ZP window below must be relocated to bytes the game leaves free.
MEMORY {
    ZP:   file = "", start = $00FC, size = $0004, type = rw, define = yes;
    MAIN: file = %O, start = $0600, size = $1A00, type = rw, define = yes;
}
SEGMENTS {
    CODE:     load = MAIN, type = ro,  define = yes;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    ZEROPAGE: load = ZP,   type = zp;
}
