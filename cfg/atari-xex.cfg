# ld65 config for a raw, fixed-address Atari image.
# Produces a flat binary of STARTUP+CODE+RODATA+DATA starting at $2000;
# tools/xex.py wraps that blob into a bootable Atari executable (.xex),
# with the run address = load address = $2000 (STARTUP is emitted first, and
# the program's entry point is the first byte of STARTUP).
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __LOADADDR__: type = export, value = $2000;
}
MEMORY {
    ZP:   file = "",  start = $0082, size = $007E, type = rw, define = yes;
    MAIN: file = %O,  start = $2000, size = $9E00, type = rw, define = yes;
}
SEGMENTS {
    STARTUP:  load = MAIN, type = ro,  define = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    ZEROPAGE: load = ZP,   type = zp;
}
