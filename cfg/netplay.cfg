# ld65 config for the netplay patch. One link, two flat images:
#   <out>.resident -> $BC00-$BFFF  stays in memory (overlays the dead loader)
#   <out>.lobby    -> $2000        boot-time front end; it also carries RES2,
#                                  which it copies to $0224 before launching
# tools/mkdisk.py appends both as segments to the game's binary-load stream.
MEMORY {
    RES: file = "%O.resident", start = $BC00, size = $0400;
    LOB: file = "%O.lobby",    start = $2000, size = $1000;
    P2:  file = "",            start = $0224, size = $00DC;   # dead OS vars
    ST:  file = "",            start = $0180, size = $0050;   # stack page floor
}
SEGMENTS {
    RESIDENT: load = RES, type = rw;
    LOBBY:    load = LOB, type = rw;
    RES2:     load = LOB, run = P2, type = rw, define = yes;
    STATE:    load = ST,  type = bss, define = yes;
}
