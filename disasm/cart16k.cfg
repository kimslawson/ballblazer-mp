# ld65 config to reassemble a 16K Atari cartridge disassembly ($8000-$BFFF)
# back into a byte-exact raw image.  da65 emits everything into the default
# "CODE" segment with no .org, so the linker fixes the origin at $8000 and
# writes a flat 16384-byte file.  fill=yes guarantees the full window is
# emitted even if a trailing range were ever left implicit.
MEMORY {
    ROM: file = %O, start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
}
