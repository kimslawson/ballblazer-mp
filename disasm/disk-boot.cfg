# ld65 config to reassemble the 384-byte disk boot loader ($0700-$087F) into a
# byte-exact image, so `make rebuild` can verify the boot disassembly is
# faithful before you trust it. da65 emits into the default CODE segment with
# no .org; the linker fixes the origin at $0700.
MEMORY {
    LOADER: file = %O, start = $0700, size = $0180, type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = LOADER, type = ro;
}
